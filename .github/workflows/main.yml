name: X-Unlock Clean Rebuild

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Test Publish
    runs-on: windows-latest

    env:
      CONFIGURATION: Release
      RUNTIME: win-x64
      PUBLISH_DIR: publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show environment
        shell: pwsh
        run: |
          dotnet --info
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Runtime: $env:RUNTIME"

      - name: Check required files
        shell: pwsh
        run: |
          $files = @(
            "XUnlock.csproj",
            "App.xaml",
            "App.xaml.cs",
            "MainWindow.xaml",
            "MainWindow.xaml.cs"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing required file: $file"
            }

            Write-Host "OK: $file"
          }

      - name: Check CSharp namespaces
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.cs -Recurse |
            Where-Object {
              $_.FullName -notmatch "\\bin\\" -and
              $_.FullName -notmatch "\\obj\\" -and
              $_.FullName -notmatch "\\publish\\"
            }

          foreach ($file in $files) {
            $matches = Select-String `
              -Path $file.FullName `
              -Pattern '^\s*namespace\s+[A-Za-z_][A-Za-z0-9_.]*\s*;\s*$'

            if ($matches.Count -gt 1) {
              Write-Host "ERROR: $($file.FullName)"

              foreach ($match in $matches) {
                Write-Host "Line $($match.LineNumber): $($match.Line.Trim())"
              }

              throw "Multiple file-scoped namespaces detected."
            }
          }

          Write-Host "Namespace check passed."

      - name: Restore application
        shell: pwsh
        run: dotnet restore XUnlock.csproj

      - name: Restore tests
        shell: pwsh
        run: |
          if (Test-Path "Tests/XUnlock.Tests.csproj") {
            dotnet restore Tests/XUnlock.Tests.csproj
          }

      - name: Build application
        shell: pwsh
        run: |
          dotnet build XUnlock.csproj `
            --configuration $env:CONFIGURATION `
            --no-restore `
            --verbosity normal

      - name: Build tests
        shell: pwsh
        run: |
          if (Test-Path "Tests/XUnlock.Tests.csproj") {
            dotnet build Tests/XUnlock.Tests.csproj `
              --configuration $env:CONFIGURATION `
              --no-restore `
              --verbosity normal
          }

      - name: Run tests
        shell: pwsh
        run: |
          if (Test-Path "Tests/XUnlock.Tests.csproj") {
            dotnet test Tests/XUnlock.Tests.csproj `
              --configuration $env:CONFIGURATION `
              --no-build `
              --verbosity normal `
              --logger "trx;LogFileName=test-results.trx"
          }

      - name: Restore win-x64
        shell: pwsh
        run: |
          dotnet restore XUnlock.csproj `
            --runtime $env:RUNTIME

      - name: Publish Windows EXE
        shell: pwsh
        run: |
          if (Test-Path $env:PUBLISH_DIR) {
            Remove-Item $env:PUBLISH_DIR -Recurse -Force
          }

          dotnet publish XUnlock.csproj `
            --configuration $env:CONFIGURATION `
            --runtime $env:RUNTIME `
            --self-contained true `
            --output $env:PUBLISH_DIR `
            --no-restore `
            --verbosity normal

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Join-Path $env:PUBLISH_DIR "XUnlock.exe"

          if (-not (Test-Path $exe)) {
            throw "XUnlock.exe was not produced."
          }

          $info = Get-Item $exe

          if ($info.Length -lt 50000) {
            throw "XUnlock.exe is unexpectedly small: $($info.Length) bytes."
          }

          Write-Host "EXE: $($info.FullName)"
          Write-Host "Size: $($info.Length) bytes"

      - name: Create ZIP
        shell: pwsh
        run: |
          $zip = "X-Unlock-win-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$env:PUBLISH_DIR\*" `
            -DestinationPath $zip `
            -Force

          if (-not (Test-Path $zip)) {
            throw "ZIP was not created."
          }

          Write-Host "Created: $zip"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: X-Unlock-EXE
          path: publish/XUnlock.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: X-Unlock-win-x64
          path: X-Unlock-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X-Unlock-Test-Results
          path: |
            **/TestResults/*.trx
            **/test-results.trx
          if-no-files-found: warn
          retention-days: 30
