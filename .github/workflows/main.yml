name: X-Unlock Clean Rebuild

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  CONFIGURATION: Release
  RUNTIME: win-x64
  PUBLISH_DIR: publish
  ZIP_NAME: X-Unlock-win-x64.zip

jobs:
  build-test-publish:
    name: Build, Test and Publish Windows EXE
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------
      # SOURCE
      # ------------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # .NET
      # ------------------------------------------------------------

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show build environment
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "BUILD ENVIRONMENT"
          Write-Host "========================================"

          dotnet --info

          Write-Host ""
          Write-Host "Windows:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

      # ------------------------------------------------------------
      # PROJECT VALIDATION
      # ------------------------------------------------------------

      - name: Validate repository structure
        shell: pwsh
        run: |
          $required = @(
            "XUnlock.csproj",
            "App.xaml",
            "App.xaml.cs",
            "MainWindow.xaml",
            "MainWindow.xaml.cs"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required project file is missing: $file"
            }

            Write-Host "OK: $file"
          }

          if (Test-Path "Tests/XUnlock.Tests.csproj") {
            Write-Host "OK: Tests/XUnlock.Tests.csproj"
          }

      # ------------------------------------------------------------
      # CHECK FILE-SCOPED NAMESPACES
      # Prevents the CS8954 error we had before.
      # ------------------------------------------------------------

      - name: Validate C# namespace structure
        shell: pwsh
        run: |
          $files = Get-ChildItem `
            -Path . `
            -Filter *.cs `
            -Recurse |
            Where-Object {
              $_.FullName -notmatch "\\bin\\" -and
              $_.FullName -notmatch "\\obj\\" -and
              $_.FullName -notmatch "\\publish\\"
            }

          $errors = 0

          foreach ($file in $files) {
            $matches = Select-String `
              -Path $file.FullName `
              -Pattern '^\s*namespace\s+[A-Za-z_][A-Za-z0-9_.]*\s*;\s*$'

            if ($matches.Count -gt 1) {
              Write-Host ""
              Write-Host "ERROR: Multiple file-scoped namespaces:"
              Write-Host $file.FullName

              foreach ($match in $matches) {
                Write-Host "  Line $($match.LineNumber): $($match.Line.Trim())"
              }

              $errors++
            }
          }

          if ($errors -gt 0) {
            throw "Found $errors C# file(s) containing multiple file-scoped namespace declarations."
          }

          Write-Host "Namespace validation passed."

      # ------------------------------------------------------------
      # RESTORE
      # ------------------------------------------------------------

      - name: Restore application
        shell: pwsh
        run: |
          dotnet restore XUnlock.csproj `
            --verbosity normal

      - name: Restore tests
        shell: pwsh
        run: |
          if (Test-Path "Tests/XUnlock.Tests.csproj") {
            dotnet restore Tests/XUnlock.Tests.csproj `
              --verbosity normal
          }
          else {
            Write-Host "No test project found."
          }

      # ------------------------------------------------------------
      # BUILD APPLICATION
      # ------------------------------------------------------------

      - name: Build application
        shell: pwsh
        run: |
          dotnet build XUnlock.csproj `
            --configuration $env:CONFIGURATION `
            --no-restore `
            --verbosity normal

      # ------------------------------------------------------------
      # BUILD TESTS
      # ------------------------------------------------------------

      - name: Build tests
        shell: pwsh
        run: |
          if (Test-Path "Tests/XUnlock.Tests.csproj") {
            dotnet build Tests/XUnlock.Tests.csproj `
              --configuration $env:CONFIGURATION `
              --no-restore `
              --verbosity normal
          }
          else {
            Write-Host "No test project found."
          }

      # ------------------------------------------------------------
      # TESTS
      # ------------------------------------------------------------

      - name: Run tests
        shell: pwsh
        run: |
          if (Test-Path "Tests/XUnlock.Tests.csproj") {
            dotnet test Tests/XUnlock.Tests.csproj `
              --configuration $env:CONFIGURATION `
              --no-build `
              --verbosity normal `
              --logger "trx;LogFileName=test-results.trx"
          }
          else {
            Write-Host "No test project found."
          }

      # ------------------------------------------------------------
      # RUNTIME-SPECIFIC RESTORE
      #
      # This specifically prevents NETSDK1047 that happened
      # in the previous project.
      # ------------------------------------------------------------

      - name: Restore win-x64 publish dependencies
        shell: pwsh
        run: |
          dotnet restore XUnlock.csproj `
            --runtime $env:RUNTIME `
            --verbosity normal

      # ------------------------------------------------------------
      # CLEAN PUBLISH DIRECTORY
      # ------------------------------------------------------------

      - name: Prepare publish directory
        shell: pwsh
        run: |
          if (Test-Path $env:PUBLISH_DIR) {
            Remove-Item `
              $env:PUBLISH_DIR `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $env:PUBLISH_DIR `
            -Force | Out-Null

      # ------------------------------------------------------------
      # PUBLISH REAL WINDOWS EXE
      # ------------------------------------------------------------

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish XUnlock.csproj `
            --configuration $env:CONFIGURATION `
            --runtime $env:RUNTIME `
            --self-contained true `
            --output $env:PUBLISH_DIR `
            --no-restore `
            --verbosity normal

      # ------------------------------------------------------------
      # VERIFY PUBLISHED FILES
      # ------------------------------------------------------------

      - name: Verify published application
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "PUBLISHED FILES"
          Write-Host "========================================"

          Get-ChildItem `
            -Path $env:PUBLISH_DIR `
            -Recurse |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          $exe = Join-Path `
            $env:PUBLISH_DIR `
            "XUnlock.exe"

          if (-not (Test-Path $exe)) {
            throw "XUnlock.exe was not produced."
          }

          $info = Get-Item $exe

          if ($info.Length -lt 50000) {
            throw "XUnlock.exe is suspiciously small: $($info.Length) bytes."
          }

          $runtimeConfig = Join-Path `
            $env:PUBLISH_DIR `
            "XUnlock.runtimeconfig.json"

          $deps = Join-Path `
            $env:PUBLISH_DIR `
            "XUnlock.deps.json"

          if (-not (Test-Path $runtimeConfig)) {
            throw "XUnlock.runtimeconfig.json is missing."
          }

          if (-not (Test-Path $deps)) {
            throw "XUnlock.deps.json is missing."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "PUBLISH VERIFICATION PASSED"
          Write-Host "========================================"
          Write-Host "EXE: $($info.FullName)"
          Write-Host "SIZE: $($info.Length) bytes"

      # ------------------------------------------------------------
      # BUILD INFORMATION
      # ------------------------------------------------------------

      - name: Create build information
        shell: pwsh
        run: |
          $commit = "${{ github.sha }}"
          $shortCommit = $commit.Substring(0, 7)

          @"
X-Unlock Clean Rebuild
======================

Repository:     ${{ github.repository }}
Commit:         $commit
Short commit:   $shortCommit

Configuration:  $env:CONFIGURATION
Runtime:        $env:RUNTIME
Self-contained: true

Workflow:       ${{ github.workflow }}
Run ID:         ${{ github.run_id }}
Run number:     ${{ github.run_number }}

Runner OS:      $env:RUNNER_OS
Runner image:   $env:ImageOS

Build UTC:      $(Get-Date -Format "yyyy-MM-dd HH:mm:ss 'UTC'")

Build:          PASSED
Tests:          PASSED
Publish:        PASSED
EXE validation: PASSED
"@ | Set-Content `
            -Path "$env:PUBLISH_DIR\BUILD_INFO.txt" `
            -Encoding UTF8

      # ------------------------------------------------------------
      # ZIP
      # ------------------------------------------------------------

      - name: Create ZIP package
        shell: pwsh
        run: |
          if (Test-Path $env:ZIP_NAME) {
            Remove-Item `
              $env:ZIP_NAME `
              -Force
          }

          Compress-Archive `
            -Path "$env:PUBLISH_DIR\*" `
            -DestinationPath $env:ZIP_NAME `
            -CompressionLevel Optimal `
            -Force

          if (-not (Test-Path $env:ZIP_NAME)) {
            throw "ZIP package was not created."
          }

          $zip = Get-Item $env:ZIP_NAME

          if ($zip.Length -lt 100000) {
            throw "ZIP package is suspiciously small: $($zip.Length) bytes."
          }

          Write-Host "ZIP created:"
          Write-Host $zip.FullName
          Write-Host "Size: $($zip.Length) bytes"

      # ------------------------------------------------------------
      # SHA256
      # ------------------------------------------------------------

      - name: Generate SHA256
        shell: pwsh
        run: |
          $exe = Join-Path `
            $env:PUBLISH_DIR `
            "XUnlock.exe"

          $zip = $env:ZIP_NAME

          $exeHash = Get-FileHash `
            $exe `
            -Algorithm SHA256

          $zipHash = Get-FileHash `
            $zip `
            -Algorithm SHA256

          @"
X-Unlock SHA256
===============

XUnlock.exe
$($exeHash.Hash)

$env:ZIP_NAME
$($zipHash.Hash)
"@ | Set-Content `
            -Path "$env:PUBLISH_DIR\SHA256.txt" `
            -Encoding UTF8

          Write-Host "EXE SHA256:"
          Write-Host $exeHash.Hash

          Write-Host ""
          Write-Host "ZIP SHA256:"
          Write-Host $zipHash.Hash

      # ------------------------------------------------------------
      # ARTIFACT: ZIP
      # ------------------------------------------------------------

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: X-Unlock-win-x64
          path: X-Unlock-win-x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ------------------------------------------------------------
      # ARTIFACT: EXE
      # ------------------------------------------------------------

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: X-Unlock-EXE
          path: publish/XUnlock.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ------------------------------------------------------------
      # ARTIFACT: FULL PUBLISH
      # ------------------------------------------------------------

      - name: Upload complete publish directory
        uses: actions/upload-artifact@v4
        with:
          name: X-Unlock-Full-Publish
          path: publish/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      # ------------------------------------------------------------
      # TEST RESULTS
      # ------------------------------------------------------------

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X-Unlock-Test-Results
          path: |
            Tests/TestResults/**/*.trx
            TestResults/**/*.trx
            **/test-results.trx
          if-no-files-found: warn
          retention-days: 30
